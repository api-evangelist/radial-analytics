name: Radial Analytics
description: 'Radial Analytics (Radial) is a Concord, Massachusetts healthcare technology
  company providing an AI/ML-powered clinical decision-support platform for the value-based
  care market. Its HIPAA-compliant, SOC 2 Type II certified software helps ACOs, hospitals,
  health systems, payers, and Medicare Advantage plans account for millions of clinical,
  claims, and quality datapoints to improve patient outcomes while reducing cost of
  care. Products include Radial Care, ACO Compare, Opportunity Navigator, decision-support
  modules, care pathways, and TEAM bundles. The company was founded by MIT PhDs Thaddeus
  Fulford-Jones and Eric Weiss and is backed by Initialized Capital. Added to the API
  Evangelist network as a portfolio-lead company profile; the company publishes no
  public API, developer portal, or SDK.'
